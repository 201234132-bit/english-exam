<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English MCQ - الامتحان</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>الامتحان</h1>
      <p id="meta">تحميل الأسئلة...</p>

      <div id="questions"></div>
      <button id="submitBtn" disabled>تسليم الامتحان</button>
      <div class="small">بعد التسليم سيتم عرض نتيجة وحفظها.</div>
    </div>
  </div>

  <div id="backdrop" class="modal-backdrop">
    <div class="modal">
      <h2 id="resultTitle">النتيجة</h2>
      <div id="resultBody"></div>
      <a id="waBtn" target="_blank" rel="noopener">تواصل واتساب</a>
    </div>
  </div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw6piXRevzQmElgtYYwHDX4Rm8v8rgESKVzNjF4OxnBw-c08t9-SVby8d7GZF6QKJhY/exec
";
const API_KEY = "a9s8d7f6g5h4j3k2l1";
const WHATSAPP_NUMBER = "201234567890"; // بدون + ، مثال مصر: 20 ثم الرقم

const studentId = localStorage.getItem("student_id");
if (!studentId) {
  window.location.href = "index.html";
}

const qWrap = document.getElementById('questions');
const submitBtn = document.getElementById('submitBtn');
const meta = document.getElementById('meta');

let questions = [];

async function loadQuestions() {
  const url = WEB_APP_URL + "?action=questions";
  const res = await fetch(url);
  const data = await res.json();
  if (!data.ok) throw new Error("Failed to load questions");
  questions = data.questions;
  meta.textContent = `عدد الأسئلة: ${data.total}`;
  renderQuestions();
  submitBtn.disabled = false;
}

function renderQuestions() {
  qWrap.innerHTML = "";
  for (const q of questions) {
    const box = document.createElement('div');
    box.className = "q";
    box.innerHTML = `<div><b>${q.text}</b></div>`;

    q.options.forEach((opt, idx) => {
      const id = `${q.id}_${idx}`;
      const label = document.createElement('label');
      label.className = "opt";
      label.setAttribute("for", id);
      label.innerHTML = `
        <input type="radio" name="${q.id}" id="${id}" value="${idx}">
        <span>${opt}</span>
      `;
      box.appendChild(label);
    });

    qWrap.appendChild(box);
  }
}

function collectAnswers() {
  const answers = {};
  for (const q of questions) {
    const selected = document.querySelector(`input[name="${q.id}"]:checked`);
    answers[q.id] = selected ? Number(selected.value) : -1;
  }
  return answers;
}

submitBtn.addEventListener('click', async () => {
  submitBtn.disabled = true;

  const answers = collectAnswers();
  const payload = {
    api_key: API_KEY,
    action: "submit_exam",
    student_id: studentId,
    answers,
    user_agent: navigator.userAgent
  };

  try {
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Submit failed");

    showResult(data.score, data.total);
  } catch (err) {
    alert("خطأ: " + err.message);
    submitBtn.disabled = false;
  }
});

function showResult(score, total) {
  const backdrop = document.getElementById('backdrop');
  const body = document.getElementById('resultBody');
  const waBtn = document.getElementById('waBtn');

  body.innerHTML = `<p>درجتك: <b>${score}</b> من <b>${total}</b></p>`;

  const msg = encodeURIComponent(`نتيجتي في امتحان الانجليزي: ${score}/${total}. student_id: ${studentId}`);
  waBtn.href = `https://wa.me/${+201007746197}?text=${msg}`;

  backdrop.style.display = "grid";
}

loadQuestions().catch(err => {
  meta.textContent = "فشل تحميل الأسئلة";
  qWrap.innerHTML = `<p>${err.message}</p>`;
});
</script>
</body>
</html>
